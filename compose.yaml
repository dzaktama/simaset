services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: simaset-app
    container_name: simaset_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - simaset_network

  web:
    image: nginx:alpine
    container_name: simaset_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - simaset_network

  db:
    image: mysql:8.0
    container_name: simaset_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-simaset}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-simaset_user}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - simaset_network

networks:
  simaset_network:
    driver: bridge

volumes:
  db_data:
