<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence Diagram - Alur Peminjaman Aset</title>
</head>

<body style="margin: 0; padding: 20px; background: white; display: flex; justify-content: center;">
    <svg width="1400" height="1600" xmlns="http://www.w3.org/2000/svg">
        <!-- Title -->
        <text x="700" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">
            Sequence Diagram - Pengajuan (User) & Persetujuan (Admin)
        </text>

        <!-- Lifeline Headers -->
        <!-- Actor: User -->
        <rect x="50" y="60" width="100" height="60" fill="white" stroke="black" stroke-width="2" />
        <text x="100" y="95" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">User</text>

        <!-- Actor: Admin -->
        <rect x="200" y="60" width="100" height="60" fill="white" stroke="black" stroke-width="2" />
        <text x="250" y="95" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Admin</text>

        <!-- View -->
        <rect x="350" y="60" width="120" height="60" fill="white" stroke="black" stroke-width="2" />
        <text x="410" y="95" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">View</text>

        <!-- Controller -->
        <rect x="520" y="60" width="160" height="60" fill="white" stroke="black" stroke-width="2" />
        <text x="600" y="85" font-family="Arial" font-size="14" font-weight="bold"
            text-anchor="middle">AssetRequest</text>
        <text x="600" y="105" font-family="Arial" font-size="14" font-weight="bold"
            text-anchor="middle">Controller</text>

        <!-- Models Group -->
        <rect x="730" y="60" width="350" height="60" fill="white" stroke="black" stroke-width="2" />
        <text x="905" y="95" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Models
            (Request/Asset)</text>

        <!-- Database -->
        <rect x="1150" y="60" width="100" height="60" fill="white" stroke="black" stroke-width="2" />
        <text x="1200" y="95" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Database</text>

        <!-- Lifelines -->
        <line x1="100" y1="120" x2="100" y2="1550" stroke="black" stroke-width="1" stroke-dasharray="5,5" />
        <line x1="250" y1="120" x2="250" y2="1550" stroke="black" stroke-width="1" stroke-dasharray="5,5" />
        <line x1="410" y1="120" x2="410" y2="1550" stroke="black" stroke-width="1" stroke-dasharray="5,5" />
        <line x1="600" y1="120" x2="600" y2="1550" stroke="black" stroke-width="1" stroke-dasharray="5,5" />
        <line x1="905" y1="120" x2="905" y2="1550" stroke="black" stroke-width="1" stroke-dasharray="5,5" />
        <line x1="1200" y1="120" x2="1200" y2="1550" stroke="black" stroke-width="1" stroke-dasharray="5,5" />

        <!-- PHASE 1: User Request -->
        <rect x="40" y="140" width="200" height="30" fill="#e6f3ff" stroke="none" />
        <text x="50" y="160" font-family="Arial" font-size="12" font-weight="bold" fill="blue">PHASE 1: Pengajuan
            (User)</text>

        <!-- Msg 1 -->
        <line x1="100" y1="190" x2="410" y2="190" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
        <text x="255" y="180" font-family="Arial" font-size="11" text-anchor="middle">1. Pilih Aset & Isi Form</text>

        <!-- Msg 2 -->
        <line x1="410" y1="220" x2="600" y2="220" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
        <text x="505" y="210" font-family="Arial" font-size="11" text-anchor="middle">2. Ajukan Peminjaman (POST
            store)</text>
        <rect x="595" y="220" width="10" height="150" fill="#e0e0e0" stroke="black" stroke-width="1" />

        <!-- Msg 3 -->
        <line x1="605" y1="250" x2="1200" y2="250" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
        <text x="900" y="240" font-family="Arial" font-size="11" text-anchor="middle">3. Simpan Data Peminjaman
            (INSERT)</text>
        <rect x="1195" y="250" width="10" height="30" fill="#e0e0e0" stroke="black" stroke-width="1" />

        <!-- Msg 4 -->
        <line x1="1200" y1="290" x2="605" y2="290" stroke="black" stroke-width="2" stroke-dasharray="5,5"
            marker-end="url(#arrow)" />
        <text x="900" y="280" font-family="Arial" font-size="11" text-anchor="middle">4. Berhasil Disimpan (Status:
            Pending)</text>

        <!-- Msg 5 -->
        <line x1="600" y1="330" x2="100" y2="330" stroke="black" stroke-width="2" stroke-dasharray="5,5"
            marker-end="url(#arrow)" />
        <text x="350" y="320" font-family="Arial" font-size="11" text-anchor="middle">5. Tampilkan "Menunggu
            Persetujuan"</text>

        <!-- Divider -->
        <line x1="50" y1="370" x2="1300" y2="370" stroke="black" stroke-width="2" stroke-dasharray="2,2" />

        <!-- PHASE 2: Approval -->
        <rect x="40" y="390" width="230" height="30" fill="#fff0e6" stroke="none" />
        <text x="50" y="410" font-family="Arial" font-size="12" font-weight="bold" fill="red">PHASE 2: Persetujuan
            (Admin)</text>

        <!-- Msg 6 -->
        <line x1="250" y1="440" x2="410" y2="440" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
        <text x="330" y="430" font-family="Arial" font-size="11" text-anchor="middle">6. Review Permintaan</text>

        <!-- Msg 7 -->
        <line x1="410" y1="470" x2="600" y2="470" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
        <text x="505" y="460" font-family="Arial" font-size="11" text-anchor="middle">7. Setujui Peminjaman (POST
            approve)</text>
        <rect x="595" y="470" width="10" height="900" fill="#e0e0e0" stroke="black" stroke-width="1" />

        <!-- Msg 8 -->
        <line x1="605" y1="500" x2="1200" y2="500" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
        <text x="900" y="490" font-family="Arial" font-size="11" text-anchor="middle">8. Cek Stok Aset (SELECT)</text>
        <rect x="1195" y="500" width="10" height="30" fill="#e0e0e0" stroke="black" stroke-width="1" />

        <!-- Msg 9 -->
        <line x1="1200" y1="540" x2="605" y2="540" stroke="black" stroke-width="2" stroke-dasharray="5,5"
            marker-end="url(#arrow)" />
        <text x="900" y="530" font-family="Arial" font-size="11" text-anchor="middle">9. Info Stok</text>

        <!-- ALT Fragment -->
        <rect x="520" y="580" width="800" height="850" fill="none" stroke="black" stroke-width="2" />
        <text x="525" y="600" font-family="Arial" font-size="13" font-weight="bold">alt</text>
        <text x="560" y="600" font-family="Arial" font-size="12" font-weight="bold">[Stok Mencukupi]</text>

        <!-- SUFFICIENT STOCK -->
        <!-- Msg 10 -->
        <line x1="605" y1="640" x2="905" y2="640" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
        <text x="755" y="630" font-family="Arial" font-size="11" text-anchor="middle">10. Set Data: Status
            Approved</text>
        <rect x="900" y="640" width="10" height="30" fill="#e0e0e0" stroke="black" stroke-width="1" />

        <!-- Msg 11 -->
        <line x1="905" y1="680" x2="1200" y2="680" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
        <text x="1050" y="670" font-family="Arial" font-size="11" text-anchor="middle">11. Update Peminjaman (UPDATE
            status)</text>
        <rect x="1195" y="680" width="10" height="30" fill="#e0e0e0" stroke="black" stroke-width="1" />

        <!-- Msg 12 -->
        <line x1="1200" y1="720" x2="605" y2="720" stroke="black" stroke-width="2" stroke-dasharray="5,5"
            marker-end="url(#arrow)" />
        <text x="900" y="710" font-family="Arial" font-size="11" text-anchor="middle">12. Status Terupdate</text>

        <!-- Msg 13 -->
        <line x1="605" y1="760" x2="905" y2="760" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
        <text x="755" y="750" font-family="Arial" font-size="11" text-anchor="middle">13. Kurangi Estimasi Stok</text>
        <rect x="900" y="760" width="10" height="30" fill="#e0e0e0" stroke="black" stroke-width="1" />

        <!-- Msg 14 -->
        <line x1="905" y1="800" x2="1200" y2="800" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
        <text x="1050" y="790" font-family="Arial" font-size="11" text-anchor="middle">14. Kurangi Stok Aset (UPDATE
            qty--)</text>
        <rect x="1195" y="800" width="10" height="30" fill="#e0e0e0" stroke="black" stroke-width="1" />

        <!-- Msg 15 -->
        <line x1="1200" y1="840" x2="605" y2="840" stroke="black" stroke-width="2" stroke-dasharray="5,5"
            marker-end="url(#arrow)" />
        <text x="900" y="830" font-family="Arial" font-size="11" text-anchor="middle">15. Stok Berkurang</text>

        <!-- NoteTransaction -->
        <rect x="950" y="880" width="200" height="30" fill="#fffacd" stroke="black" stroke-width="1" />
        <text x="1050" y="900" font-family="Arial" font-size="11" text-anchor="middle">Note: Menggunakan DB
            Transaction</text>

        <!-- ELSE Condition -->
        <line x1="520" y1="940" x2="1320" y2="940" stroke="black" stroke-width="2" stroke-dasharray="10,5" />
        <text x="525" y="960" font-family="Arial" font-size="12" font-weight="bold">else</text>
        <text x="560" y="960" font-family="Arial" font-size="12" font-weight="bold">[Stok Tidak Cukup]</text>

        <!-- Msg 16 -->
        <line x1="605" y1="1000" x2="250" y2="1000" stroke="black" stroke-width="2" stroke-dasharray="5,5"
            marker-end="url(#arrow)" />
        <text x="425" y="990" font-family="Arial" font-size="11" text-anchor="middle">16. Tampilkan Pesan Error (Stok
            Habis)</text>

        <!-- End ALT -->

        <!-- Common Finalization (Success) -->
        <line x1="605" y1="1450" x2="1200" y2="1450" stroke="black" stroke-width="2" marker-end="url(#arrow)" />
        <text x="900" y="1440" font-family="Arial" font-size="11" text-anchor="middle">17. Catat Log Sistem (INSERT
            logs)</text>
        <rect x="1195" y="1450" width="10" height="30" fill="#e0e0e0" stroke="black" stroke-width="1" />

        <!-- Final Response -->
        <line x1="1200" y1="1500" x2="250" y2="1500" stroke="black" stroke-width="2" stroke-dasharray="5,5"
            marker-end="url(#arrow)" />
        <text x="725" y="1490" font-family="Arial" font-size="11" text-anchor="middle">18. Redirect Sukses (Peminjaman
            Disetujui)</text>

        <!-- Arrow Definitions -->
        <defs>
            <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                <polygon points="0 0, 10 3, 0 6" fill="black" />
            </marker>
        </defs>
    </svg>
</body>

</html>
